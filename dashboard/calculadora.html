<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #f0f0f0;
}

.calculadora {
    background: white;
    padding: 20px;
    border-radius: 10px;
    display: inline-block;
    margin-top: 50px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

input, select, button {
    margin: 10px;
    padding: 10px;
    font-size: 16px;
}

button {
    cursor: pointer;
}

#resultado {
    margin-top: 15px;
    font-weight: bold;
    font-size: 18px;
}
</style>

</head>
<body>

<div class="calculadora">
    <h2>Calculadora Básica</h2>

    <input type="number" id="num1" placeholder="Número 1">
    
    <select id="operador">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <input type="number" id="num2" placeholder="Número 2">

    <br>

    <button onclick="calcular()">Calcular</button>

    <div id="resultado"></div>
</div>

<script>
function calculadora(num1, num2, operador) {
    let resultado;
    
    switch (operador) {
        case '+':
            resultado = num1 + num2;
            break;
        case '-':
            resultado = num1 - num2;
            break;
        case '*':
            resultado = num1 * num2;
            break;
        case '/':
            if (num2 === 0) {
                return "Error: No se puede dividir por cero";
            }
            resultado = num1 / num2;
            break;
        default:
            return "Error: Operador no válido";
    }
    
    return resultado;
}

function calcular() {
    let num1 = parseFloat(document.getElementById("num1").value);
    let num2 = parseFloat(document.getElementById("num2").value);
    let operador = document.getElementById("operador").value;

    if (isNaN(num1) || isNaN(num2)) {
        document.getElementById("resultado").innerText = "Ingresá números válidos";
        return;
    }

    let resultado = calculadora(num1, num2, operador);

    document.getElementById("resultado").innerText = "Resultado: " + resultado;
}
</script>

</body>
</html>
